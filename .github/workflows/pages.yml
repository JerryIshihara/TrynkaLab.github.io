name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v7
        with:
          ref: main
          path: production

      - name: Check for staging branch
        id: staging
        shell: bash
        run: |
          if git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/staging >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out preview
        if: steps.staging.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: staging
          path: preview

      - name: Select dependency lockfile
        id: sources
        shell: bash
        run: |
          if [[ -f production/package.json && -f production/package-lock.json ]]; then
            echo "production_ready=true" >> "$GITHUB_OUTPUT"
            echo "lockfile=production/package-lock.json" >> "$GITHUB_OUTPUT"
          elif [[ -f preview/package.json && -f preview/package-lock.json ]]; then
            echo "production_ready=false" >> "$GITHUB_OUTPUT"
            echo "lockfile=preview/package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "Neither main nor staging contains a buildable website." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.sources.outputs.lockfile }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Resolve deployment paths
        id: paths
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "${repository_name,,}" == "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]]; then
            production_base=""
          else
            production_base="/${repository_name}"
          fi
          echo "production_base=${production_base}" >> "$GITHUB_OUTPUT"
          echo "preview_base=${production_base}/preview" >> "$GITHUB_OUTPUT"

      - name: Build production from main
        if: steps.sources.outputs.production_ready == 'true'
        working-directory: production
        env:
          SITE_BASE: ${{ steps.paths.outputs.production_base }}
        run: |
          npm ci
          npm run build

      - name: Prepare Pages artifact
        shell: bash
        run: mkdir -p production/doc_build

      - name: Build preview from staging
        if: steps.staging.outputs.exists == 'true'
        working-directory: preview
        env:
          SITE_BASE: ${{ steps.paths.outputs.preview_base }}
        run: |
          npm ci
          npm run build

      - name: Add preview to the Pages artifact
        if: steps.staging.outputs.exists == 'true'
        shell: bash
        run: |
          mkdir -p production/doc_build/preview
          cp -a preview/doc_build/. production/doc_build/preview/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: production/doc_build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
